<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Croquis</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
}

#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  padding: 12px;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #f5f5f5;
}

button.active {
  background: #4CAF50;
  color: white;
}

#numeros {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

#canvasContainer {
  flex: 1;
}

canvas {
  width: 100%;
  height: 100%;
  border: 1px solid #ccc;
  touch-action: none;
}

#acciones {
  display: flex;
  gap: 10px;
  position: sticky;
  bottom: 0;
  background: white;
}
</style>
</head>

<body>

<input id="nombre" placeholder="Nombre recinto"/>

<div id="toolbar">
  <button data-mode="select" onclick="setMode('select')">🖱️</button>
  <button data-mode="draw" onclick="setMode('draw')">🖊️</button>
  <button data-mode="line" onclick="setMode('line')">📏</button>
  <button data-mode="rect" onclick="setMode('rect')">⬛</button>

  <button onclick="agregarPuerta()">🚪</button>

  <button onclick="duplicar()">📑</button>
  <button onclick="rotar()">🔄</button>

  <button onclick="borrar()">🧽</button>
  <button onclick="limpiarCanvas()">🧹</button>

  <button onclick="undo()">↩️</button>

  <button onclick="zoomIn()">➕</button>
  <button onclick="zoomOut()">➖</button>
  <button onclick="resetZoom()">🔄</button>
</div>

<div id="numeros">
  <button onclick="agregarNumero(1)">1</button>
  <button onclick="agregarNumero(2)">2</button>
  <button onclick="agregarNumero(3)">3</button>
  <button onclick="agregarNumero(4)">4</button>
  <button onclick="agregarNumero(5)">5</button>
  <button onclick="agregarNumero(6)">6</button>
  <button onclick="agregarNumero(7)">7</button>
  <button onclick="agregarNumero(8)">8</button>
  <button onclick="agregarNumero(9)">9</button>
  <button onclick="agregarNumero(0)">0</button>
</div>

<div id="canvasContainer">
  <canvas id="canvas"></canvas>
</div>

<div id="acciones">
  <button onclick="descargarPDF()">📄</button>
  <button onclick="guardar()">💾</button>
</div>

<script>
const canvas = new fabric.Canvas('canvas');
canvas.allowTouchScrolling = false;

// resize
function resizeCanvas(){
  const c = document.getElementById("canvasContainer");
  canvas.setWidth(c.clientWidth);
  canvas.setHeight(c.clientHeight);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// =====================
let mode="select";
function setMode(m){
  mode=m;
  canvas.isDrawingMode=(m==="draw");
  document.querySelectorAll("#toolbar button").forEach(b=>b.classList.remove("active"));
  const btn=document.querySelector(`[data-mode='${m}']`);
  if(btn) btn.classList.add("active");
}

// =====================
// dibujo básico
let isDown=false, startX, startY, tempObj;

canvas.on("mouse:down",function(o){
  isDown=true;
  const p=canvas.getPointer(o.e);
  startX=p.x; startY=p.y;

  if(mode==="line"){
    tempObj=new fabric.Line([startX,startY,startX,startY],{stroke:"black",strokeWidth:2});
    canvas.add(tempObj);
  }

  if(mode==="rect"){
    tempObj=new fabric.Rect({left:startX,top:startY,width:0,height:0,fill:"transparent",stroke:"black"});
    canvas.add(tempObj);
  }
});

canvas.on("mouse:move",function(o){
  if(!isDown||!tempObj) return;
  const p=canvas.getPointer(o.e);

  if(mode==="line") tempObj.set({x2:p.x,y2:p.y});
  if(mode==="rect") tempObj.set({width:p.x-startX,height:p.y-startY});

  canvas.renderAll();
});

canvas.on("mouse:up",function(){
  isDown=false;
  tempObj=null;
});

// =====================
// numero
function agregarNumero(n){
  const t=new fabric.Text(n.toString(),{left:100,top:100,fontSize:24});
  canvas.add(t);
  canvas.setActiveObject(t);
}

// =====================
// puerta H
function agregarPuerta(){
  const c="#8B4513";

  const l1=new fabric.Line([0,0,40,0],{stroke:c,strokeWidth:4});
  const l2=new fabric.Line([0,20,40,20],{stroke:c,strokeWidth:4});
  const v=new fabric.Line([20,0,20,20],{stroke:c,strokeWidth:4});

  const g=new fabric.Group([l1,l2,v],{left:100,top:100});
  canvas.add(g);
  canvas.setActiveObject(g);
}

// =====================
// duplicar
function duplicar(){
  const obj=canvas.getActiveObject();
  if(!obj) return;
  obj.clone(clone=>{
    clone.set({left:obj.left+20,top:obj.top+20});
    canvas.add(clone);
  });
}

// =====================
// rotar
function rotar(){
  const obj=canvas.getActiveObject();
  if(obj){
    obj.rotate((obj.angle||0)+15);
    canvas.renderAll();
  }
}

// =====================
function borrar(){
  const obj=canvas.getActiveObject();
  if(obj) canvas.remove(obj);
}

function limpiarCanvas(){
  if(confirm("¿Borrar todo?")) canvas.clear();
}

// =====================
// zoom
let zoom=1;

function zoomIn(){ zoom*=1.2; canvas.setZoom(zoom); }
function zoomOut(){ zoom*=0.8; canvas.setZoom(zoom); }
function resetZoom(){ zoom=1; canvas.setZoom(1); }

// pinch
let lastDist=null;

canvas.upperCanvasEl.addEventListener("touchmove",function(e){
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);

    if(lastDist){
      let delta=dist/lastDist;
      zoom*=delta;
      canvas.setZoom(zoom);
    }
    lastDist=dist;
  }
});

canvas.upperCanvasEl.addEventListener("touchend",()=>lastDist=null);

// =====================
// PDF FIX
async function descargarPDF(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  const temp=new fabric.StaticCanvas(null,{width:canvas.width,height:canvas.height});

  const img=canvas.toDataURL("image/png");
  pdf.addImage(img,"PNG",10,10,180,120);

  pdf.save("croquis.pdf");
}

// =====================
function guardar(){
  const data={
    nombre:document.getElementById("nombre").value,
    imagen:canvas.toDataURL("image/png")
  };

  fetch("/guardar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
  .then(()=>alert("guardado"));
}
</script>

</body>
</html>
