<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Croquis</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;
  max-width: 900px;

  display: flex;
  flex-direction: column;
  height: 100vh;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  padding: 12px;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #f5f5f5;
}

button.active {
  background: #4CAF50;
  color: white;
}

#pisos button {
  margin: 3px;
}

#numeros {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

#canvasContainer {
  flex: 1;
  min-height: 200px;
}

canvas {
  width: 100%;
  height: 100%;
  border: 1px solid #ccc;
  touch-action: none;
}

#acciones {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  background: white;
  position: sticky;
  bottom: 0;
}

#guardarBtn {
  flex: 1;
  background: #4CAF50;
  color: white;
}
</style>
</head>

<body>

<h3>Croquis de recinto</h3>

<input id="nombre" placeholder="Nombre del recinto"/>

<div>
  <button onclick="agregarPiso()">+ Piso</button>
  <div id="pisos"></div>
</div>

<div id="toolbar">
  <button data-mode="select" onclick="setMode('select')" title="Seleccionar">🖱️</button>
  <button data-mode="draw" onclick="setMode('draw')" title="Dibujo libre">🖊️</button>
  <button data-mode="line" onclick="setMode('line')" title="Línea">📏</button>
  <button data-mode="rect" onclick="setMode('rect')" title="Rectángulo">⬛</button>

  <button onclick="agregarPuerta()" title="Agregar puerta">🚪</button>

  <button onclick="borrar()" title="Borrar seleccionado">🧽</button>
  <button onclick="limpiarCanvas()" title="Borrar todo">🧹</button>

  <button onclick="undo()" title="Deshacer">↩️</button>

  🎨 <input type="color" id="color" value="#000000">
  📏 <input type="number" id="width" value="2" min="1" max="10" style="width:60px;">
</div>

<div id="numeros">
  Números:
  <button onclick="agregarNumero(1)">1</button>
  <button onclick="agregarNumero(2)">2</button>
  <button onclick="agregarNumero(3)">3</button>
  <button onclick="agregarNumero(4)">4</button>
  <button onclick="agregarNumero(5)">5</button>
  <button onclick="agregarNumero(6)">6</button>
  <button onclick="agregarNumero(7)">7</button>
  <button onclick="agregarNumero(8)">8</button>
  <button onclick="agregarNumero(9)">9</button>
  <button onclick="agregarNumero(0)">0</button>
</div>

<div id="canvasContainer">
  <canvas id="canvas"></canvas>
</div>

<div id="acciones">
  <button onclick="descargarPDF()" title="Descargar PDF">📄</button>
  <button id="guardarBtn" onclick="guardar()">💾 Guardar</button>
</div>

<script>
const canvas = new fabric.Canvas('canvas');
canvas.allowTouchScrolling = false;

// Resize dinámico
function resizeCanvas() {
  const container = document.getElementById("canvasContainer");
  canvas.setWidth(container.clientWidth);
  canvas.setHeight(container.clientHeight);
  canvas.renderAll();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// =====================
let mode = "select";
let isDown = false;
let startX, startY;
let tempObj = null;

let pisos = {};
let pisoActivo = null;
let history = [];

// =====================
function setMode(m) {
  mode = m;
  canvas.isDrawingMode = (m === 'draw');

  document.querySelectorAll("#toolbar button").forEach(b => b.classList.remove("active"));
  const btn = document.querySelector(`[data-mode='${m}']`);
  if (btn) btn.classList.add("active");
}

// =====================
canvas.on("mouse:down", function(o) {
  isDown = true;
  const p = canvas.getPointer(o.e);
  startX = p.x;
  startY = p.y;

  const color = document.getElementById("color").value;
  const width = parseInt(document.getElementById("width").value);

  if (mode === "line") {
    tempObj = new fabric.Line([startX, startY, startX, startY], {
      stroke: color,
      strokeWidth: width
    });
    canvas.add(tempObj);
  }

  if (mode === "rect") {
    tempObj = new fabric.Rect({
      left: startX,
      top: startY,
      width: 0,
      height: 0,
      fill: "transparent",
      stroke: color,
      strokeWidth: width
    });
    canvas.add(tempObj);
  }
});

canvas.on("mouse:move", function(o) {
  if (!isDown || !tempObj) return;
  const p = canvas.getPointer(o.e);

  if (mode === "line") tempObj.set({ x2: p.x, y2: p.y });

  if (mode === "rect") {
    tempObj.set({
      width: p.x - startX,
      height: p.y - startY
    });
  }

  canvas.renderAll();
});

canvas.on("mouse:up", function() {
  isDown = false;
  tempObj = null;
  saveHistory();
});

// =====================
function agregarNumero(n) {
  const text = new fabric.Text(n.toString(), {
    left: 100,
    top: 100,
    fontSize: 24,
    fill: document.getElementById("color").value
  });

  canvas.add(text);
  canvas.setActiveObject(text);
  saveHistory();
}

// =====================
function agregarPuerta() {
  const color = document.getElementById("color").value;

  const linea = new fabric.Line([0, 0, 40, 0], {
    stroke: color,
    strokeWidth: 3
  });

  const arco = new fabric.Circle({
    radius: 40,
    startAngle: 0,
    endAngle: Math.PI / 2,
    stroke: color,
    fill: '',
    left: 0,
    top: 0
  });

  const grupo = new fabric.Group([linea, arco], {
    left: 100,
    top: 100
  });

  canvas.add(grupo);
  canvas.setActiveObject(grupo);
  saveHistory();
}

// =====================
function borrar() {
  const obj = canvas.getActiveObject();
  if (obj) {
    canvas.remove(obj);
    saveHistory();
  }
}

function limpiarCanvas() {
  if (confirm("¿Borrar todo este piso?")) {
    canvas.clear();
    saveHistory();
  }
}

// =====================
function saveHistory() {
  history.push(canvas.toJSON());
}

function undo() {
  if (history.length > 1) {
    history.pop();
    canvas.loadFromJSON(history[history.length - 1], canvas.renderAll.bind(canvas));
  }
}

// =====================
function agregarPiso() {
  const nombre = prompt("Nombre del piso:");
  if (!nombre) return;

  pisos[nombre] = null;
  crearBotonPiso(nombre);

  if (!pisoActivo) cambiarPiso(nombre);
}

function crearBotonPiso(nombre) {
  const btn = document.createElement("button");
  btn.innerText = nombre;
  btn.onclick = () => cambiarPiso(nombre);
  document.getElementById("pisos").appendChild(btn);
}

function cambiarPiso(nombre) {
  if (pisoActivo) pisos[pisoActivo] = canvas.toJSON();

  pisoActivo = nombre;
  canvas.clear();
  history = [];

  if (pisos[nombre]) {
    canvas.loadFromJSON(pisos[nombre], () => {
      canvas.renderAll();
      saveHistory();
    });
  }
}

// =====================
async function descargarPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  let first = true;

  for (const nombrePiso in pisos) {
    if (pisos[nombrePiso]) {
      await new Promise(resolve => {
        canvas.loadFromJSON(pisos[nombrePiso], () => {
          canvas.renderAll();
          resolve();
        });
      });
    } else {
      canvas.clear();
    }

    const img = canvas.toDataURL("image/png");

    if (!first) pdf.addPage();
    first = false;

    pdf.setFontSize(14);
    pdf.text(`Recinto: ${document.getElementById("nombre").value}`, 10, 10);
    pdf.text(`Piso: ${nombrePiso}`, 10, 18);

    pdf.addImage(img, "PNG", 10, 25, 180, 120);
  }

  pdf.save("croquis.pdf");

  if (pisoActivo) cambiarPiso(pisoActivo);
}

// =====================
function guardar() {
  if (pisoActivo) pisos[pisoActivo] = canvas.toJSON();

  const data = {
    nombre: document.getElementById("nombre").value,
    pisos: pisos,
    imagen: canvas.toDataURL("image/png")
  };

  fetch("/guardar", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => alert("Guardado correctamente"));
}
</script>

</body>
</html>
