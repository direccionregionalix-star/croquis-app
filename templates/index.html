<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Croquis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

button {
  padding: 12px;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #f5f5f5;
}

#pisos button {
  margin: 3px;
}

canvas {
  border: 1px solid #ccc;
  width: 100%;
  height: 60vh;
  touch-action: none;
}

#acciones {
  margin-top: 10px;
  display: flex;
  gap: 10px;
}

#guardarBtn {
  flex: 1;
  background: #4CAF50;
  color: white;
}
</style>
</head>

<body>

<h3>Croquis de recinto</h3>

<input id="nombre" placeholder="Nombre del recinto"/>

<div>
  <button onclick="agregarPiso()">+ Piso</button>
  <div id="pisos"></div>
</div>

<div id="toolbar">
  <button onclick="setMode('select')" title="Seleccionar">🖱️</button>
  <button onclick="setMode('draw')" title="Dibujo libre">🖊️</button>
  <button onclick="setMode('line')" title="Línea">📏</button>
  <button onclick="setMode('rect')" title="Rectángulo">⬛</button>
  <button onclick="setMode('polygon')" title="Polígono">🔺</button>

  <button onclick="borrar()" title="Borrar objeto seleccionado">🧽</button>
  <button onclick="limpiarCanvas()" title="Borrar todo el piso">🧹</button>

  <button onclick="undo()" title="Deshacer">↩️</button>

  🎨 <input type="color" id="color" value="#000000">
  📏 <input type="number" id="width" value="2" min="1" max="10" style="width:60px;">
</div>

<canvas id="canvas"></canvas>

<div id="acciones">
  <button onclick="descargarImagen()" title="Descargar croquis">⬇️</button>
  <button id="guardarBtn" onclick="guardar()" title="Guardar en servidor">💾 Guardar</button>
</div>

<script>
const canvas = new fabric.Canvas('canvas');
canvas.allowTouchScrolling = false;

// Ajustar tamaño dinámico
function resizeCanvas() {
  const c = document.getElementById("canvas");
  canvas.setWidth(c.clientWidth);
  canvas.setHeight(window.innerHeight * 0.6);
  canvas.renderAll();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// =====================
let mode = "select";
let isDown = false;
let startX, startY;
let tempObj = null;
let polygonPoints = [];
let polygonLines = [];

let pisos = {};
let pisoActivo = null;
let history = [];

// =====================
function setMode(m) {
  mode = m;
  canvas.isDrawingMode = (m === 'draw');

  if (m !== "polygon") resetPolygon();
}

// =====================
canvas.on("mouse:down", function(o) {
  isDown = true;
  const p = canvas.getPointer(o.e);
  startX = p.x;
  startY = p.y;

  const color = document.getElementById("color").value;
  const width = parseInt(document.getElementById("width").value);

  if (mode === "line") {
    tempObj = new fabric.Line([startX, startY, startX, startY], {
      stroke: color,
      strokeWidth: width
    });
    canvas.add(tempObj);
  }

  if (mode === "rect") {
    tempObj = new fabric.Rect({
      left: startX,
      top: startY,
      width: 0,
      height: 0,
      fill: "transparent",
      stroke: color,
      strokeWidth: width
    });
    canvas.add(tempObj);
  }

  if (mode === "polygon") addPolygonPoint(p);
});

canvas.on("mouse:move", function(o) {
  if (!isDown || !tempObj) return;

  const p = canvas.getPointer(o.e);

  if (mode === "line") tempObj.set({ x2: p.x, y2: p.y });

  if (mode === "rect") {
    tempObj.set({
      width: p.x - startX,
      height: p.y - startY
    });
  }

  canvas.renderAll();
});

canvas.on("mouse:up", function() {
  isDown = false;
  tempObj = null;
  saveHistory();
});

// =====================
// POLIGONOS
canvas.on("mouse:dblclick", function() {
  if (mode === "polygon" && polygonPoints.length > 2) {
    const color = document.getElementById("color").value;
    const width = parseInt(document.getElementById("width").value);

    const poly = new fabric.Polygon(polygonPoints, {
      fill: "transparent",
      stroke: color,
      strokeWidth: width
    });

    canvas.add(poly);

    polygonLines.forEach(o => canvas.remove(o));
    resetPolygon();
    saveHistory();
  }
});

function addPolygonPoint(p) {
  polygonPoints.push({ x: p.x, y: p.y });

  const dot = new fabric.Circle({
    left: p.x,
    top: p.y,
    radius: 3,
    fill: "red",
    selectable: false
  });

  canvas.add(dot);
  polygonLines.push(dot);

  if (polygonPoints.length > 1) {
    const prev = polygonPoints[polygonPoints.length - 2];
    const line = new fabric.Line([prev.x, prev.y, p.x, p.y], {
      stroke: "gray",
      selectable: false
    });
    canvas.add(line);
    polygonLines.push(line);
  }
}

function resetPolygon() {
  polygonPoints = [];
  polygonLines.forEach(o => canvas.remove(o));
  polygonLines = [];
}

// =====================
function borrar() {
  const obj = canvas.getActiveObject();
  if (obj) {
    canvas.remove(obj);
    saveHistory();
  }
}

function limpiarCanvas() {
  if (confirm("¿Borrar todo este piso?")) {
    canvas.clear();
    saveHistory();
  }
}

// =====================
function saveHistory() {
  history.push(canvas.toJSON());
}

function undo() {
  if (history.length > 1) {
    history.pop();
    canvas.loadFromJSON(history[history.length - 1], canvas.renderAll.bind(canvas));
  }
}

// =====================
function agregarPiso() {
  const nombre = prompt("Nombre del piso:");
  if (!nombre) return;

  pisos[nombre] = null;
  crearBotonPiso(nombre);

  if (!pisoActivo) cambiarPiso(nombre);
}

function crearBotonPiso(nombre) {
  const btn = document.createElement("button");
  btn.innerText = nombre;
  btn.onclick = () => cambiarPiso(nombre);
  document.getElementById("pisos").appendChild(btn);
}

function cambiarPiso(nombre) {
  if (pisoActivo) pisos[pisoActivo] = canvas.toJSON();

  pisoActivo = nombre;
  canvas.clear();
  history = [];

  if (pisos[nombre]) {
    canvas.loadFromJSON(pisos[nombre], () => {
      canvas.renderAll();
      saveHistory();
    });
  }
}

// =====================
function descargarImagen() {
  const link = document.createElement('a');
  link.href = canvas.toDataURL("image/png");
  link.download = "croquis.png";
  link.click();
}

// =====================
function guardar() {
  if (pisoActivo) pisos[pisoActivo] = canvas.toJSON();

  const data = {
    nombre: document.getElementById("nombre").value,
    pisos: pisos,
    imagen: canvas.toDataURL("image/png")
  };

  fetch("/guardar", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => alert("Guardado correctamente"));
}
</script>

</body>
</html>
